name: Sunday coach

on:
  # Sundays at 23:15 UTC: 6:15 pm in Toronto in winter, 7:15 pm in summer.
  schedule:
    - cron: '15 23 * * 0'
  # The "Run workflow" button on the Actions tab.
  workflow_dispatch:
  # Pushing a change to agent/RUN also runs it, for a check-in on demand.
  push:
    branches: [main]
    paths: ['agent/RUN']

permissions:
  contents: write   # commit public/coach.json

concurrency:
  group: sunday-coach
  cancel-in-progress: true

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Toronto
      COACH_MODEL: qwen2.5:7b
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the agent's guardrails
        run: node --test agent/coach.test.mjs

      # The model runs right here on the runner, so there's no API, key or bill.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service; run our own as this user instead.
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done

      # Keep the model download (about 4.7 GB) between weeks.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ env.COACH_MODEL }}

      - name: Get the model
        run: ollama pull "$COACH_MODEL"

      - name: Run the coach
        env:
          COACH_PROVIDER: ollama
        run: |
          # A push to agent/RUN starting with "dry-run" prints the check-in without publishing it.
          if [ "${{ github.event_name }}" = "push" ] && head -1 agent/RUN | grep -q '^dry-run'; then
            node agent/coach.mjs --dry-run
          else
            node agent/coach.mjs
          fi

      - name: Ollama log (if something went wrong)
        if: failure()
        run: tail -50 /tmp/ollama.log || true

      - name: Publish the check-in
        run: |
          # Committed under Eric's GitHub no-reply address so Vercel deploys it.
          git config user.name "Eric Hartman (Sunday coach)"
          git config user.email "erixhartman@users.noreply.github.com"
          [ -f public/coach.json ] && git add public/coach.json
          if git diff --cached --quiet; then
            echo "No change to publish."
            exit 0
          fi
          git commit -m "Coach: check-in for the week of $(node -e "const j=require('./public/coach.json');console.log(j.updates[0].weekOf)")"
          git pull --rebase origin main
          git push origin HEAD:main
